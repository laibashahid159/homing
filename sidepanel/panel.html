<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homebase</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>Homebase</h1>
    <button id="pin-current" class="primary" title="Pin current tab (Alt+Shift+P)">+ Pin tab</button>
  </header>

  <ul id="list" aria-label="Pinned tabs"></ul>

  <div id="empty" hidden>
    <p class="empty-title">No pinned tabs yet</p>
    <p>Open a site you use all the time and hit <strong>+ Pin tab</strong>.
       Wander off as much as you like — one click brings it back home.</p>
  </div>

  <footer>
    <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> sends the current tab home</span>
  </footer>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
