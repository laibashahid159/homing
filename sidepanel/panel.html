<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homebase</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>Homebase</h1>
    <button id="pin-current" class="primary" title="Pin current tab (Alt+Shift+P)">+ Pin tab</button>
  </header>

  <section id="favorites" class="fav-grid" aria-label="Favorites"></section>

  <section id="pinned-section" class="section" aria-label="Pinned tabs">
    <div class="section-head">
      <span>Pinned</span>
      <button id="new-folder" class="ghost" title="New folder">+ Folder</button>
    </div>
    <div id="pinned"></div>
  </section>

  <section id="today-section" class="section" aria-label="Open tabs">
    <div class="section-head"><span>Today</span></div>
    <button id="new-tab" class="row new-tab" type="button">
      <span class="row-icon" data-icon="plus"></span>
      <span class="info"><span class="title">New tab</span></span>
    </button>
    <ul id="today" class="rows"></ul>
  </section>

  <footer>
    <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> sends the current tab home · right-click for more
  </footer>

  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="toast" role="status" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
